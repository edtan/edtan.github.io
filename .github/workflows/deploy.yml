name: Build and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy: a publish from the CMS is a real commit, and
# dropping it mid-flight would leave the live site behind the repository.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
      TZ: America/Toronto
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Shallow on purpose. enableGitInfo is off, so no history is needed,
          # and this repository accumulates image blobs — a full clone would get
          # slower with every photo ever published.
          fetch-depth: 1
          lfs: false

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo
        run: |
          echo "Installing Hugo ${HUGO_VERSION} (extended)..."
          curl -sfL --output-dir "${{ runner.temp }}" -O \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Log tool versions
        run: hugo version

      # Restores the previous run's image derivatives. Without this every deploy
      # re-encodes the entire photo library: ~500 ms per derivative, so cost grows
      # linearly with the archive instead of with what was just published.
      - name: Restore Hugo cache
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: hugo-${{ github.run_id }}
          restore-keys: hugo-

      # baseURL comes from hugo.toml, deliberately not from
      # steps.pages.outputs.base_url. This site is served on a custom domain; if the
      # Pages custom-domain setting were ever unset, that output would silently
      # become the github.io URL and rewrite every absolute URL on the live site.
      - name: Build
        run: |
          hugo build \
            --gc \
            --minify \
            --cacheDir "${{ runner.temp }}/.cache/hugo"

      # Guards the publishResources cascade in hugo.toml. Without it, every
      # full-size original is published alongside its derivatives, roughly doubling
      # the published site against Pages' hard 1 GB limit. Fails loudly rather than
      # silently eating the budget.
      - name: Check no full-size originals were published
        run: |
          leaked=$(find public -name '*.webp' ! -name '*_hu_*' || true)
          if [[ -n "$leaked" ]]; then
            echo "::error::Full-size originals were published — the publishResources cascade in hugo.toml is broken:"
            echo "$leaked"
            exit 1
          fi
          echo "OK: only resized derivatives published."

      - name: Report published size
        run: |
          echo "Published site size: $(du -sh public | cut -f1)"
          echo "GitHub Pages hard limit is 1 GB."

      - name: Save Hugo cache
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
