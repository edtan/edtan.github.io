<!doctype html>
<html lang="{{ or site.Language.Locale "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ "/" | relURL }}">{{ site.Title }}</a>
    <nav>
      <a href="{{ "/photos/" | relURL }}">Photos</a>
      <a href="{{ "/posts/" | relURL }}">Writing</a>
    </nav>
  </header>

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <p>&copy; {{ now.Year }} {{ site.Copyright | default site.Title }}</p>
  </footer>
</body>
</html>
