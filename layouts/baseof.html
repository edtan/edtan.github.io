<!doctype html>
<html lang="{{ or site.Language.Locale "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ "/" | relURL }}">{{ site.Title }}</a>
    <nav class="site-nav">
      <a href="{{ "/photos/" | relURL }}"{{ if eq .Section "photos" }} aria-current="page"{{ end }}>Photos</a>
      <a href="{{ "/posts/" | relURL }}"{{ if eq .Section "posts" }} aria-current="page"{{ end }}>Writing</a>
    </nav>
  </header>

  <main>
    {{ block "main" . }}{{ end }}
  </main>
</body>
</html>
