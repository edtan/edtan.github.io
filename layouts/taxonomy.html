{{ define "main" }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
</header>

{{- with .Pages }}
<ul class="tags">
  {{- range . }}
  <li><a href="{{ .RelPermalink }}">{{ .Title }} <span class="meta">{{ len .Pages }}</span></a></li>
  {{- end }}
</ul>
{{- else }}
<p class="empty">No tags yet.</p>
{{- end }}
{{ end }}
