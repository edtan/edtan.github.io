{{ define "main" }}
<h1>{{ .Title }}</h1>
<ul class="entry-list">
  {{- range .Pages }}
  <li>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ if not .Date.IsZero }}
    <span class="meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
    </span>
    {{ end }}
  </li>
  {{- end }}
</ul>
{{ end }}
