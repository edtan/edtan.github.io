{{ define "main" }}
<header class="page-header">
  <p class="eyebrow">Tagged</p>
  <h1>{{ .Title }}</h1>
</header>

<ul class="entry-list">
  {{- range .Pages }}
  <li>
    <a href="{{ .RelPermalink }}">
      <span class="entry-title">{{ .Title }}</span>
      {{ if not .Date.IsZero }}
      <span class="meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time></span>
      {{ end }}
    </a>
  </li>
  {{- end }}
</ul>
{{ end }}
